tasks.register('gitCommitRelease', Exec) {
    group = "release-git"
    dependsOn setReleaseVersion
    commandLine 'git', 'commit', '-am', "release v${project.findProperty('releaseVersion') ?: ''}"
}

tasks.register('gitTagRelease', Exec) {
    group = "release-git"
    dependsOn gitCommitRelease
    commandLine 'git', 'tag', "v${project.findProperty('releaseVersion') ?: ''}"
}

tasks.register('gitPushRelease', Exec) {
    group = "release-git"
    dependsOn gitTagRelease
    commandLine 'git', 'push', '--follow-tags'
}

tasks.register('gitCommitSnapshot', Exec) {
    group = "release-git"
    dependsOn setSnapshotVersion
    commandLine 'git', 'commit', '-am', "prepare new release ${project.findProperty('nextSnapshotVersion') ?: ''}-SNAPSHOT"
}

tasks.register('gitPushSnapshot', Exec) {
    group = "release-git"
    dependsOn gitCommitSnapshot
    commandLine 'git', 'push'
}
